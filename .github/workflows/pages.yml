name: Build and deploy the gallery and guide
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nt3d
    steps:
      - uses: actions/checkout@v7
        with:
          path: nt3d
          persist-credentials: false
          submodules: true # the hugo-book theme for the guide
      - uses: actions/setup-go@v7
        with:
          go-version-file: nt3d/go.mod
          cache-dependency-path: |
            nt3d/go.sum
            nt3d/examples/demos/go.sum
      - uses: go-task/setup-task@v2
        with:
          version: '3.x'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true
      # The gallery, with the guide at its /docs/.
      - run: task build-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: nt3d/dist/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
