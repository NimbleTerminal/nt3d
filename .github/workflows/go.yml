name: Build Go
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nt3d
    steps:
      - uses: actions/checkout@v7
        with:
          path: nt3d
      # Bootstrap ntpicture at its go.mod pin until its vanity version resolves,
      # and ntgpuimage at the unreleased mipmap, sRGB, and sampler work nt3d
      # uses until its next release. ntcanvas is downloaded normally.
      - uses: actions/checkout@v7
        with:
          repository: NimbleTerminal/ntpicture
          ref: acfa6954d2d0bcef277f65317528b9a7cdc85017
          path: ntpicture
      - uses: actions/checkout@v7
        with:
          repository: NimbleTerminal/ntgpuimage
          ref: 933755ea3a2ba33f27e537346c90ce79b1cc4868
          path: ntgpuimage
      - uses: actions/setup-go@v7
        with:
          go-version-file: nt3d/go.mod
          cache-dependency-path: |
            nt3d/go.sum
            nt3d/examples/terrain/go.sum
      - uses: go-task/setup-task@v2
        with:
          version: '3.x'
      - run: task workspace
      - run: task ci
