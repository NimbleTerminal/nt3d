name: Build Go
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nt3d
    steps:
      - uses: actions/checkout@v7
        with:
          path: nt3d
      - uses: actions/setup-go@v7
        with:
          go-version-file: nt3d/go.mod
          cache-dependency-path: |
            nt3d/go.sum
            nt3d/examples/demos/go.sum
      - uses: go-task/setup-task@v2
        with:
          version: '3.x'
      - run: task ci
