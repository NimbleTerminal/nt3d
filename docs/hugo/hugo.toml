baseURL = "https://nimbleterminal.github.io/nt3d/docs/"
title = "nt3d"
theme = "hugo-book"
contentDir = "content"

# Disable auto-generated timestamps for reproducible builds
enableGitInfo = false

[params]
  description = "A small 3D scene engine for terminal and browser applications, in Go"

  # hugo-book theme params
  BookTheme = "auto"
  # The table of contents takes a column of the page. The theme lets a page
  # turn it off but not on, so it is on here, and pages too short to want
  # one say bookToC: false in their front matter.
  BookToC = true
  BookSection = "*"
  BookRepo = "https://github.com/NimbleTerminal/nt3d"
  BookEditPath = "edit/main/docs/hugo"
  BookDateFormat = "January 2, 2006"
  BookSearch = true
  BookComments = false

# The gallery's poster frames are mounted in, so the guide shows the demos
# without a second copy of them.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../../web/assets"
    target = "static/posters"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]
