version: '3'

env:
  GOTOOLCHAIN: go1.26.8

vars:
  # Every demo: a command in examples/demos/cmd, built to bin/nt3d-NAME.
  DEMOS: terrain procedural dynamic shapes meshes models large fur mipmaps forest lights

tasks:
  default:
    cmds: [{task: build}]
  workspace:
    desc: Use the sibling ntpicture checkout while its release is prepared
    preconditions:
      - test -d ../ntpicture
    cmds:
      - cp go.work.example go.work
  fmt:
    cmds:
      - gofmt -w *.go math/*.go mesh/*.go mesh/*/*.go widget/*.go examples/demos/cmd/*/*.go examples/demos/internal/demo/*.go examples/demos/internal/demo/models/*.go examples/demos/internal/demo/models/generate/*.go
  fmt-check:
    cmds:
      - test -z "$(gofmt -l *.go math/*.go mesh/*.go mesh/*/*.go widget/*.go examples/demos/cmd/*/*.go examples/demos/internal/demo/*.go examples/demos/internal/demo/models/*.go examples/demos/internal/demo/models/generate/*.go)"
  test:
    cmds:
      - go test -mod=readonly ./...
      - go -C examples/demos test -mod=readonly ./...
  test-race:
    cmds:
      - go test -mod=readonly -race ./...
      - go -C examples/demos test -mod=readonly -race ./...
  test-gpu:
    desc: Explicit hardware GPU tests (fail if no GPU is available)
    cmds:
      - go test -mod=readonly -tags webgpu -run TestGPU -count=1 -v .
  vet:
    cmds:
      - go vet -mod=readonly ./...
      - go -C examples/demos vet -mod=readonly ./...
  build:
    desc: Build the library and every demo; Go's cache rebuilds only what changed
    deps:
      - build:lib
      - for: {var: DEMOS}
        task: build:demo
        vars: {NAME: '{{.ITEM}}'}
  build:lib:
    internal: true
    cmds:
      - go build -mod=readonly ./...
  # build:demo builds one demo. Each demo's task needs only its own binary;
  # build runs them all at once.
  build:demo:
    internal: true
    label: 'build:{{.NAME}}'
    requires: {vars: [NAME]}
    cmds:
      - go -C examples/demos build -mod=readonly -o ../../bin/nt3d-{{.NAME}} ./cmd/{{.NAME}}
  build-wasm:
    env:
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p dist/web/terrain dist/web/procedural dist/web/dynamic dist/web/shapes dist/web/models dist/web/large dist/web/fur dist/web/mipmaps dist/web/forest dist/web/lights
      - go -C examples/demos build -mod=readonly -o ../../dist/web/terrain/app.wasm ./cmd/terrain
      - go -C examples/demos build -mod=readonly -o ../../dist/web/procedural/app.wasm ./cmd/procedural
      - go -C examples/demos build -mod=readonly -o ../../dist/web/dynamic/app.wasm ./cmd/dynamic
      - go -C examples/demos build -mod=readonly -o ../../dist/web/shapes/app.wasm ./cmd/shapes
      - go -C examples/demos build -mod=readonly -o ../../dist/web/models/app.wasm ./cmd/models
      - go -C examples/demos build -mod=readonly -o ../../dist/web/large/app.wasm ./cmd/large
      - go -C examples/demos build -mod=readonly -o ../../dist/web/fur/app.wasm ./cmd/fur
      - go -C examples/demos build -mod=readonly -o ../../dist/web/mipmaps/app.wasm ./cmd/mipmaps
      - go -C examples/demos build -mod=readonly -o ../../dist/web/forest/app.wasm ./cmd/forest
      - go -C examples/demos build -mod=readonly -o ../../dist/web/lights/app.wasm ./cmd/lights
  web-assets:
    cmds:
      - go -C examples/demos tool booba-assets ../../dist/web/terrain/
      - go -C examples/demos tool booba-assets ../../dist/web/procedural/
      - go -C examples/demos tool booba-assets ../../dist/web/dynamic/
      - go -C examples/demos tool booba-assets ../../dist/web/shapes/
      - go -C examples/demos tool booba-assets ../../dist/web/models/
      - go -C examples/demos tool booba-assets ../../dist/web/large/
      - go -C examples/demos tool booba-assets ../../dist/web/fur/
      - go -C examples/demos tool booba-assets ../../dist/web/mipmaps/
      - go -C examples/demos tool booba-assets ../../dist/web/forest/
      - go -C examples/demos tool booba-assets ../../dist/web/lights/
  build-web:
    desc: Build the consolidated browser gallery
    cmds:
      - task: build-wasm
      - task: web-assets
      - cp -R web/. dist/web/
  build-site:
    desc: Build the gallery with the guide at its /docs/, as Pages serves them (needs hugo, extended)
    cmds:
      - task: build-web
      - task: docs:hugo:build
        vars: {CLI_ARGS: --destination ../../dist/web/docs}
  terrain:
    deps: [{task: build:demo, vars: {NAME: terrain}}]
    cmds:
      - bin/nt3d-terrain {{.CLI_ARGS}}
  procedural:
    desc: Run the procedural plasma scene (GPU shader with software fallback)
    deps: [{task: build:demo, vars: {NAME: procedural}}]
    cmds:
      - bin/nt3d-procedural {{.CLI_ARGS}}
  dynamic:
    desc: Run independently moving nodes and a deforming mesh
    deps: [{task: build:demo, vars: {NAME: dynamic}}]
    cmds:
      - bin/nt3d-dynamic {{.CLI_ARGS}}
  shapes:
    desc: Show the shape builders and normal styles
    deps: [{task: build:demo, vars: {NAME: shapes}}]
    cmds:
      - bin/nt3d-shapes {{.CLI_ARGS}}
  models:
    desc: Show sample STL, OBJ, and 3MF files
    deps: [{task: build:demo, vars: {NAME: models}}]
    cmds:
      - bin/nt3d-models {{.CLI_ARGS}}
  large:
    desc: Show a dense 735,000-triangle mesh with picking
    deps: [{task: build:demo, vars: {NAME: large}}]
    cmds:
      - bin/nt3d-large {{.CLI_ARGS}}
  fur:
    desc: Show shell fur on Spot the cow, swaying in the wind
    deps: [{task: build:demo, vars: {NAME: fur}}]
    cmds:
      - bin/nt3d-fur {{.CLI_ARGS}}
  mipmaps:
    desc: Show textures tiled to the horizon, with mipmaps or without
    deps: [{task: build:demo, vars: {NAME: mipmaps}}]
    cmds:
      - bin/nt3d-mipmaps {{.CLI_ARGS}}
  forest:
    desc: Show thousands of trees drawn instanced from three shared meshes
    deps: [{task: build:demo, vars: {NAME: forest}}]
    cmds:
      - bin/nt3d-forest {{.CLI_ARGS}}
  lights:
    desc: Show presets of ambient, directional, and orbiting point lights
    deps: [{task: build:demo, vars: {NAME: lights}}]
    cmds:
      - bin/nt3d-lights {{.CLI_ARGS}}
  models-generate:
    desc: Regenerate the sample models the models demo embeds
    cmds:
      - go -C examples/demos generate ./internal/demo/models
  meshes:
    desc: Show the shape builders, or mesh files given after --
    deps: [{task: build:demo, vars: {NAME: meshes}}]
    cmds:
      - bin/nt3d-meshes {{.CLI_ARGS}}
  tapes:
    desc: Record the demos with ntrecord, as GIFs and the gallery's poster frames (task tapes -- fur forest for some)
    vars:
      NAMES: '{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.DEMOS}}{{end}}'
    preconditions:
      - sh: command -v ntrecord
        msg: ntrecord is needed to record Kitty graphics; see https://github.com/NimbleTerminal/ntrecord
      - sh: command -v ffmpeg && command -v gifsicle
        msg: tapes/finish.sh needs ffmpeg and gifsicle (brew install ffmpeg gifsicle)
    cmds:
      - for: {var: NAMES}
        task: build:demo
        vars: {NAME: '{{.ITEM}}'}
      - mkdir -p dist/tapes
      - |
        for name in {{.NAMES}}; do
          ntrecord tapes/$name.tape && tapes/finish.sh $name || exit 1
        done
  docs:hugo:serve:
    desc: Serve the guide while editing it (needs hugo, extended, and the theme submodule)
    dir: docs/hugo
    cmds: [hugo serve]
  docs:hugo:build:
    desc: Build the guide into docs/hugo/public (pass hugo flags after --)
    dir: docs/hugo
    cmds: ['hugo --minify {{.CLI_ARGS}}']
  docs:clean:
    desc: Remove what the docs tasks generate
    cmds: [rm -rf docs/hugo/public docs/hugo/resources]
  serve:
    desc: Serve the browser gallery after task build-web
    cmds:
      - python3 -m http.server 8768 --bind 127.0.0.1 -d dist/web
  ci:
    cmds:
      - task: fmt-check
      - task: test-race
      - task: vet
      - task: build
      - task: build-web
