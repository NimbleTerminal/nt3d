version: '3'

env:
  GOTOOLCHAIN: go1.26.8

tasks:
  default:
    cmds: [{task: build}]
  workspace:
    desc: Use the sibling ntpicture checkout while its release is prepared
    preconditions:
      - test -d ../ntpicture
    cmds:
      - cp go.work.example go.work
  fmt:
    cmds:
      - gofmt -w *.go math/*.go mesh/*.go widget/*.go examples/terrain/*.go examples/terrain/cmd/*/*.go examples/terrain/internal/terraindemo/*.go examples/terrain/internal/terraindemo/models/*.go examples/terrain/internal/terraindemo/models/generate/*.go
  fmt-check:
    cmds:
      - test -z "$(gofmt -l *.go math/*.go mesh/*.go widget/*.go examples/terrain/*.go examples/terrain/cmd/*/*.go examples/terrain/internal/terraindemo/*.go examples/terrain/internal/terraindemo/models/*.go examples/terrain/internal/terraindemo/models/generate/*.go)"
  test:
    cmds:
      - go test -mod=readonly ./...
      - go -C examples/terrain test -mod=readonly ./...
  test-race:
    cmds:
      - go test -mod=readonly -race ./...
      - go -C examples/terrain test -mod=readonly -race ./...
  test-gpu:
    desc: Explicit hardware GPU tests (fail if no GPU is available)
    cmds:
      - go test -mod=readonly -tags webgpu -run TestGPU -count=1 -v .
  vet:
    cmds:
      - go vet -mod=readonly ./...
      - go -C examples/terrain vet -mod=readonly ./...
  build:
    cmds:
      - go build -mod=readonly ./...
      - go -C examples/terrain build -mod=readonly -o ../../bin/nt3d-terrain .
      - go -C examples/terrain build -mod=readonly -o ../../bin/nt3d-procedural ./cmd/procedural
      - go -C examples/terrain build -mod=readonly -o ../../bin/nt3d-dynamic ./cmd/dynamic
      - go -C examples/terrain build -mod=readonly -o ../../bin/nt3d-meshes ./cmd/meshes
      - go -C examples/terrain build -mod=readonly -o ../../bin/nt3d-shapes ./cmd/shapes
      - go -C examples/terrain build -mod=readonly -o ../../bin/nt3d-models ./cmd/models
      - go -C examples/terrain build -mod=readonly -o ../../bin/nt3d-large ./cmd/large
      - go -C examples/terrain build -mod=readonly -o ../../bin/nt3d-fur ./cmd/fur
  build-wasm:
    env:
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p dist/web/terrain dist/web/procedural dist/web/dynamic dist/web/shapes dist/web/models dist/web/large dist/web/fur
      - go -C examples/terrain build -mod=readonly -o ../../dist/web/terrain/app.wasm .
      - go -C examples/terrain build -mod=readonly -o ../../dist/web/procedural/app.wasm ./cmd/procedural
      - go -C examples/terrain build -mod=readonly -o ../../dist/web/dynamic/app.wasm ./cmd/dynamic
      - go -C examples/terrain build -mod=readonly -o ../../dist/web/shapes/app.wasm ./cmd/shapes
      - go -C examples/terrain build -mod=readonly -o ../../dist/web/models/app.wasm ./cmd/models
      - go -C examples/terrain build -mod=readonly -o ../../dist/web/large/app.wasm ./cmd/large
      - go -C examples/terrain build -mod=readonly -o ../../dist/web/fur/app.wasm ./cmd/fur
  web-assets:
    cmds:
      - go -C examples/terrain tool booba-assets ../../dist/web/terrain/
      - go -C examples/terrain tool booba-assets ../../dist/web/procedural/
      - go -C examples/terrain tool booba-assets ../../dist/web/dynamic/
      - go -C examples/terrain tool booba-assets ../../dist/web/shapes/
      - go -C examples/terrain tool booba-assets ../../dist/web/models/
      - go -C examples/terrain tool booba-assets ../../dist/web/large/
      - go -C examples/terrain tool booba-assets ../../dist/web/fur/
  build-web:
    desc: Build the consolidated browser gallery
    cmds:
      - task: build-wasm
      - task: web-assets
      - cp -R web/. dist/web/
  terrain:
    deps: [build]
    cmds:
      - bin/nt3d-terrain {{.CLI_ARGS}}
  procedural:
    desc: Run the procedural plasma scene (GPU shader with software fallback)
    deps: [build]
    cmds:
      - bin/nt3d-procedural {{.CLI_ARGS}}
  dynamic:
    desc: Run independently moving nodes and a deforming mesh
    deps: [build]
    cmds:
      - bin/nt3d-dynamic {{.CLI_ARGS}}
  shapes:
    desc: Show the shape builders and normal styles
    deps: [build]
    cmds:
      - bin/nt3d-shapes {{.CLI_ARGS}}
  models:
    desc: Show sample STL, OBJ, and 3MF files
    deps: [build]
    cmds:
      - bin/nt3d-models {{.CLI_ARGS}}
  large:
    desc: Show a dense 735,000-triangle mesh with picking
    deps: [build]
    cmds:
      - bin/nt3d-large {{.CLI_ARGS}}
  fur:
    desc: Show shell fur on a torus, swaying in the wind
    deps: [build]
    cmds:
      - bin/nt3d-fur {{.CLI_ARGS}}
  models-generate:
    desc: Regenerate the sample models the models demo embeds
    cmds:
      - go -C examples/terrain generate ./internal/terraindemo/models
  meshes:
    desc: Show the shape builders, or mesh files given after --
    deps: [build]
    cmds:
      - bin/nt3d-meshes {{.CLI_ARGS}}
  serve:
    desc: Serve the browser gallery after task build-web
    cmds:
      - python3 -m http.server 8768 --bind 127.0.0.1 -d dist/web
  ci:
    cmds:
      - task: fmt-check
      - task: test-race
      - task: vet
      - task: build
      - task: build-web
